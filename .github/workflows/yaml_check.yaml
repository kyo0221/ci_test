name: parameter-check

on:
  pull_request:
    types:
      - labeled
    paths:
      - rsf.repos

permissions:
  contents: read
  id-token: write
  pull-requests: write

# cspell: ignore deepdiff
jobs:
  make-sure-label-is-present:
    uses: autowarefoundation/autoware-github-actions/.github/workflows/make-sure-label-is-present.yaml@v1.69.1
    with:
      label: tag:run-parameter-check

  load-env:
    needs: make-sure-label-is-present
    if: ${{ needs.make-sure-label-is-present.outputs.result == 'true' }} && contains(github.event.pull_request.changed_files, 'rsf.repos')
    uses: ./.github/workflows/load-env.yaml

  yaml-test:
    needs: load-env
    if: ${{ needs.make-sure-label-is-present.outputs.result == 'true' }} && contains(github.event.pull_request.changed_files, 'rsf.repos')
    runs-on: ubuntu-24.04
    container: ros:${{ needs.load-env.outputs.rosdistro }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-duration-seconds: 900

      - name: Generate token
        id: generate-token
        uses: konippi/create-github-app-token-aws-kms@cb04ce01dfb7fba68efbbc5d0b680d80125bdc79 # v1.0.3
        with:
          app-id: ${{ vars.APP_ID }}
          kms-key-id: ${{ vars.KMS_KEY_ID }}
          owner: ${{ github.repository_owner }}
          repositories: camera_based_rl_navigation
          permission-contents: read

      - name: Set git config
        uses: autowarefoundation/autoware-github-actions/set-git-config@v1.69.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}

      # ci_test: "Install yaml diff dependencies" is removed because the stub yaml_diff.py uses only the standard library

      - name: Run vcs import
        run: |
          mkdir -p src
          # import all repos (no filtering)
          vcs import src --recursive --shallow < rsf.repos

      - name: Run yaml diff test
        run: |
          python3 .github/workflows/scripts/yaml_diff.py
          cat yaml_diff_report.md

      - name: Run Publish Result to the Pull Request
        uses: actions/github-script@v6.4.1
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('yaml_diff_report.md', 'utf8');  // Read the report file content
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: result
            })
